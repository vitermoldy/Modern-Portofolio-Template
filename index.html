<!doctype html>
<!-- Portfolio template. Every line you need to change is marked with an EDIT comment.
     The design system lives in assets/ (from tasteskill); your own styles live in css/portfolio.css. -->
<html lang="en" data-type="service" data-radius="round" data-ground="sage" data-buttons="arrow" data-motion data-theme="dark">
<head>

<meta name="site-kind" content="software">

<meta name="theme-color" content="#18191b">
<!-- EDIT: your own icon, for example <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"> -->
<link rel="icon" href="data:,">
<!-- the saved theme is applied before the first paint, so a light-mode visitor never sees a dark flash -->
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..700&family=Figtree:wght@400..600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/ui/cards.css">
<link rel="stylesheet" href="assets/motion/motion.css">

<style>
:root {
  --p-bg: #18191b; --p-surface: #222427; --p-ink: #eff0f1; --p-muted: #9c9ea3;
  --p-accent: #ff4a1f; --p-accent-ink: #18191b; --p-action: #ff4a1f; --p-action-ink: #18191b;
  --p-inv-bg: #eff0f1; --p-inv-surface: #dedfe0; --p-inv-ink: #18191b; --p-inv-muted: #5b5c5e;

  --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --display-weight: 400;

  --display-tracking-xl: -0.04em;
  --ly-scale: 0.98;
}

<link rel="stylesheet" href="css/portfolio.css">

<!-- type: service (a designer-developer people hire), site-kind software (the work is software)
     deal: hero split, nav nav-split (dealt nav-mega, dealt again: a one-page site with three sections has nothing
     to fill a mega panel), close close-type, footer footer-columns, rhythm dark-band (#process), buttons arrow,
     mark wordmark, ground sage, palette graphite-safety-orange (the owner's direction: dark, warm accent),
     type gabarito (Gabarito / Figtree + DM Mono), radius round
     moments: none. One loop: the booking card in #work, which plays while it is on screen and has a pause button. -->

<header class="nav nav--split">

    </nav>
    <div class="nav__actions">
      <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to light theme" data-theme-toggle>
